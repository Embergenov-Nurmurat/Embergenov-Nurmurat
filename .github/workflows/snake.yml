name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7C3AED&color_dots=#E2E8F0,#BFDBFE,#60A5FA,#2563EB,#1E3A8A&color_dot_border=#FFFFFF
            dist/github-snake-dark.svg?color_snake=#A5B4FC&color_dots=#1E293B,#4C1D95,#7C3AED,#22D3EE,#34D399&color_dot_border=#0B1220
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
